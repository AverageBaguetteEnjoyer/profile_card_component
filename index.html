<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="description" content="Profile card component | solution to the Frontend Mentor challenge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile card component</title>
    <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kumbh+Sans:wght,YOPQ@100..900,300&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./styles.css">
</head>
<body>
    <main>
        <article class="card">
            <div class="card__background">
                <img src="./images/bg-pattern-card.svg" alt="">
            </div>
            <div class="card__profile">
                <img class="card__profile-avatar" src="./images/image-victor.jpg" alt="Victor Crest">
                <div>
                    <h1 class="card__profile-heading">Victor Crest <span>26</span></h1>
                    <span class="card__profile-location">London</span>
                </div>
                <dl class="card__profile-stats">
                    <div class="card__profile-stat">
                        <dt>Followers</dt>
                        <dd>80K</dd>
                    </div>
                    <div class="card__profile-stat">
                        <dt>Likes</dt>
                        <dd>803K</dd>
                    </div>
                    <div class="card__profile-stat">
                        <dt>Photos</dt>
                        <dd>1.4K</dd>
                    </div>
                </dl>
            </div>
        </article>
    </main>
</body>
</html>
